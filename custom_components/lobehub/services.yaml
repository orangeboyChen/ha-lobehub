send_message:
  description: Send one user message to the configured LobeHub agent.
  target:
    entity:
      domain: conversation
      integration: lobehub
  fields:
    message:
      required: true
      example: "Order a latte"
      selector:
        text:
    context:
      required: false
      example:
        topic_id: "topic-2"
      selector:
        object:

new_topic:
  description: Create a new LobeHub topic and switch the entity to it.
  target:
    entity:
      domain: conversation
      integration: lobehub
  fields:
    topic_title:
      required: true
      example: "Buy coffee"
      selector:
        text:

switch_topic:
  description: Switch the entity to an existing LobeHub topic.
  target:
    entity:
      domain: conversation
      integration: lobehub
  fields:
    topic_id:
      required: true
      example: "topic-2"
      selector:
        text:

run_task:
  description: Run an ad-hoc agent task with the currently configured LobeHub agent.
  target:
    entity:
      domain: conversation
      integration: lobehub
  fields:
    instruction:
      required: true
      example: "Buy coffee at the nearest Luckin"
      selector:
        text:
    context:
      required: false
      example:
        topic_id: "topic-2"
      selector:
        object:
    previous_response_id:
      required: false
      example: "msg-1"
      selector:
        text:

list_tasks:
  description: List saved LobeHub tasks visible to the targeted agent workspace.
  target:
    entity:
      domain: conversation
      integration: lobehub
  fields:
    assignee_agent_id:
      required: false
      example: "agt_xxx"
      selector:
        text:
    limit:
      required: false
      example: 50
      default: 50
      selector:
        number:
          min: 1
          max: 100
          mode: box
    offset:
      required: false
      example: 0
      default: 0
      selector:
        number:
          min: 0
          mode: box
    parent_task:
      required: false
      example: "TASK-1"
      selector:
        text:
    statuses:
      required: false
      example:
        - "backlog"
        - "running"
      selector:
        select:
          multiple: true
          options:
            - "backlog"
            - "running"
            - "scheduled"
            - "paused"
            - "completed"
            - "failed"
            - "canceled"

get_task:
  description: Get one saved LobeHub task and the topics linked to it.
  target:
    entity:
      domain: conversation
      integration: lobehub
  fields:
    task:
      required: true
      example: "TASK-1 or task_xxx"
      selector:
        text:

run_saved_task:
  description: Run one saved LobeHub task by raw id or identifier such as TASK-1.
  target:
    entity:
      domain: conversation
      integration: lobehub
  fields:
    task:
      required: true
      example: "TASK-1 or task_xxx"
      selector:
        text:
    continue_topic_id:
      required: false
      example: "topic_xxx"
      selector:
        text:
    prompt:
      required: false
      example: "Continue and summarize the blockers first"
      selector:
        text:

list_agents:
  description: List visible LobeHub agents so Home Assistant actions can retrieve agent IDs.
  target:
    entity:
      domain: conversation
      integration: lobehub

list_devices:
  description: List visible LobeHub execution devices so Home Assistant actions can retrieve device IDs.
  target:
    entity:
      domain: conversation
      integration: lobehub

update_agent_settings:
  description: Update the configured LobeHub agent model, provider, execution target, or bound device.
  target:
    entity:
      domain: conversation
      integration: lobehub
  fields:
    model:
      required: false
      example: "gpt-5.1"
      selector:
        text:
    provider:
      required: false
      example: "openai"
      selector:
        text:
    runtime:
      required: false
      example: "device"
      selector:
        select:
          options:
            - "none"
            - "auto"
            - "local"
            - "device"
            - "sandbox"
    bound_device_id:
      required: false
      example: "device_xxx"
      selector:
        text:
    topic_policy:
      required: false
      example: "reuse"
      selector:
        select:
          options:
            - "reuse"
            - "new"
