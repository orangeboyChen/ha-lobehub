[project]
name = "ha-lobehub"
version = "0.2.0"
description = "Home Assistant custom integration for LobeHub"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
test = [
    "pytest>=8.3,<9",
    "voluptuous>=0.15",
]
lint = ["ruff>=0.12"]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
